name: iOS

# Build the native app and run its unit tests on a simulator. Only runs when
# something under ios/ (or this file) changes — the web app has its own CI.
on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (Xcode)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      # The anon key isn't in the repo; the tests don't talk to Supabase, so a
      # placeholder is enough to build.
      - name: Placeholder secrets
        run: echo 'SUPABASE_ANON_KEY = ci-placeholder' > ios/Config/Secrets.xcconfig

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone"))][0].udid')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/BucksBuddy.xcodeproj \
            -scheme BucksBuddy \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | if command -v xcbeautify >/dev/null; then xcbeautify --renderer github-actions; else cat; fi
