name: CI

# Guard against regressions: every PR and every push to main must pass the
# unit suite with full coverage.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    # Lets any branch (e.g. a feature branch adding a new job) be run
    # manually from the Actions tab or API — GitHub only shows the "Run
    # workflow" button, or accepts a dispatch call, when this trigger exists
    # in the workflow file on the DEFAULT branch, regardless of which ref you
    # actually pick to run.

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit & coverage (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Type-check + production build must succeed.
      - run: npm run build
      # Enforces the 100% coverage thresholds from vitest.config.ts.
      - run: npm run coverage

  mobile:
    name: Mobile unit & coverage (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # The port must type-check as strictly as the web does.
      - run: npx tsc --noEmit
      # Enforces the 100% coverage thresholds from mobile/jest.config.js.
      - run: npm run coverage
      # Proves the native crypto still reads and writes the same envelopes the
      # browser does — the rows in Supabase were encrypted there.
      - run: npm run test:interop
