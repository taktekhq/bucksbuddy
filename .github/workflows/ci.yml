name: CI

# Guard against regressions: every PR and every push to main must pass the
# unit suite with full coverage.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, so the mutation score can't rot unnoticed between releases.
    - cron: "0 3 * * *"
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit & coverage (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Type-check + production build must succeed.
      - run: npm run build
      - run: npm run core:typecheck
      # The Expo shell is intentionally bundled separately from the frozen web
      # oracle. Keep its SDK and React Native types honest on every change.
      - run: npm run mobile:typecheck
      # Enforces the 100% coverage thresholds from vitest.config.ts.
      - run: npm run coverage

  mutation:
    name: Mutation score (Stryker)
    # Coverage is pinned at 100% and so cannot move, which makes it blind to a
    # refactor that keeps every line executed while weakening the assertions
    # around it. The mutation score is the signal that can still move, and it
    # matters most while the core is being extracted for the Expo port.
    #
    # It takes minutes rather than seconds, so it runs nightly and on demand
    # rather than on every push — but it is not optional, or the score rots.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'mutation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # stryker.conf.json breaks the build below a 100% score.
      - run: npm run mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14

  mobile-ios-build:
    name: Mobile iOS build (Xcode 26.4+)
    # apps/mobile is blocked on the maintainer's Mac: Xcode 26.3 hits a known
    # Expo SDK 57 / expo-modules-jsi Swift-C++ interop compile failure
    # (expo/expo#46242) — Expo needs Xcode 26.4+. GitHub's macos-26 runner
    # ships Xcode 26.6 by default with 26.4.1 also installed, so CI proves the
    # native project actually compiles under a toolchain new enough, without
    # waiting on a local Xcode upgrade. See docs/EXPO_MIGRATION.md, Phase 1.
    #
    # This validates the *compile*, not the crypto vectors on a running
    # simulator — macOS runner minutes are expensive and this job is
    # unverified against a real macOS runner (written and reasoned from
    # documented Expo/Xcode CI conventions, not dry-run anywhere in this
    # session), so it stays opt-in until it's proven green at least once.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ios-build')
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Select Xcode 26.4.1
        # Pinned to the documented floor rather than whatever the runner
        # image's default happens to be this month — see the macos-26 image
        # README for the full list of installed Xcode versions.
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app
          xcodebuild -version
      - name: Install workspace dependencies
        working-directory: .
        run: npm ci
      - name: Prebuild the native iOS project
        # Default behavior (no --no-install) also runs `pod install`.
        run: npx expo prebuild --platform ios
      - name: Build for the simulator
        run: |
          set -euo pipefail
          workspace=$(ls ios/*.xcworkspace | head -1)
          scheme=$(xcodebuild -workspace "$workspace" -list \
            | awk '/Schemes:/{flag=1;next} flag && NF{print; exit}' | xargs)
          echo "workspace=$workspace scheme=$scheme"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            build
