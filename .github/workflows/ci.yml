name: CI

# Guard against regressions: every PR and every push to main must pass the
# unit suite with full coverage.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, so the mutation score can't rot unnoticed between releases.
    - cron: "0 3 * * *"
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit & coverage (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # >=22 — @stryker-mutator/core and @supabase/*@2.113 both require it
          # (the mutation job failed outright on Node 20; this job's mismatched
          # deps only warned, but the version should agree across jobs).
          node-version: 22
          cache: npm
      - run: npm ci
      # Type-check + production build must succeed.
      - run: npm run build
      - run: npm run core:typecheck
      # The Expo shell is intentionally bundled separately from the frozen web
      # oracle. Keep its SDK and React Native types honest on every change.
      - run: npm run mobile:typecheck
      # Enforces the 100% coverage thresholds from vitest.config.ts.
      - run: npm run coverage

  mutation:
    name: Mutation score (Stryker)
    # Coverage is pinned at 100% and so cannot move, which makes it blind to a
    # refactor that keeps every line executed while weakening the assertions
    # around it. The mutation score is the signal that can still move, and it
    # matters most while the core is being extracted for the Expo port.
    #
    # It takes minutes rather than seconds, so it runs nightly and on demand
    # rather than on every push — but it is not optional, or the score rots.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'mutation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # stryker.conf.json breaks the build below a 100% score.
      - run: npm run mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14

  mobile-android-crypto-check:
    name: Mobile Android crypto gate
    # Android needs no Xcode/macOS at all, so this runs on a plain ubuntu
    # runner (KVM is available there for the emulator) — no toolchain-version
    # blocker like iOS's, and no macOS-runner cost or uncertainty either.
    #
    # This closes the one leg Validator #4's automated suite can't reach on
    # its own (packages/core/src/crypto-vectors.test.ts, which only runs
    # WebCrypto vs. the pure-JS noble referee, both in Node): whether
    # react-native-quick-crypto itself, actually running on a device, agrees
    # with the frozen envelopes. Boots an emulator, builds and installs a
    # debug APK, deep-links straight into bucksbuddy://crypto-check (which
    # auto-runs on mount), and reads the verdict back from logcat.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install workspace dependencies
        working-directory: .
        run: npm ci
      - name: Prebuild the native Android project
        run: npx expo prebuild --platform android
      - name: Build the debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Boot an emulator, install, launch, and read the result
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            set -euo pipefail
            apk=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
            echo "installing $apk"
            adb wait-for-device
            adb install -r "$apk"
            adb logcat -c
            adb shell am start -a android.intent.action.VIEW -d "bucksbuddy://crypto-check"
            # PBKDF2 at 600k iterations plus JS-bundle startup needs real time.
            for i in $(seq 1 30); do
              adb logcat -d | grep -q "CRYPTO_CHECK_RESULT" && break
              sleep 2
            done
            adb logcat -d | grep "CRYPTO_CHECK_RESULT" | tee /tmp/crypto-check.log
            grep -q "CRYPTO_CHECK_RESULT=PASS" /tmp/crypto-check.log
